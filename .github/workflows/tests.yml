name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      domaenenprobe:
        description: "Zusätzlich die volle Domänen-Probe messen (Linux, ca. 15–30 min, Bericht als Artefakt)"
        type: boolean
        default: false

# Der Workflow liest nur das Repository; er schreibt nichts zurück.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
      # Mitgelieferte deutsche OCR-Sprachdatei aus dem Repository
      TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Systempakete fuer Linux (virtuelles Display, Tk, Screenshots)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb tk scrot

      # pyyaml (Prüfung dieser Datei) und Pillow (Scans mit Schräglage in tests/test_tabellen_scans.py) brauchen nur
      # die Tests. Sie stehen nicht in requirements-dev.txt: EXE-bauen.bat installiert diese Datei, und PyInstaller
      # packte Pillow sonst in die EXE (pymupdf importiert es optional).
      - name: Pakete installieren (nur fertige Wheels, kein Quellbau)
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt pyyaml pillow

      - name: Installation pruefen
        timeout-minutes: 5
        run: python werkzeuge/pruefe_installation.py

      # GitHub-Windows-Runner laufen oft nur mit 1024x768. Die Aufloesung wird protokolliert und,
      # wo das Cmdlet vorhanden ist, auf 1920x1080 gestellt. Bleibt sie klein, ueberspringt der
      # Layout-Test nur die Skalierungen, die Windows auf so einem Bildschirm gar nicht anbietet
      # (Begruendung steht im Testbericht, pytest -rs).
      - name: Bildschirmaufloesung (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          "Vorher:  $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force
          } else {
            "Set-DisplayResolution gibt es auf diesem Runner nicht - Aufloesung bleibt."
          }
          "Nachher: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          python -c "import tkinter as tk; r = tk.Tk(); print('Tk sieht', r.winfo_screenwidth(), 'x', r.winfo_screenheight(), '- tk scaling', r.tk.call('tk', 'scaling')); r.destroy()"

      - name: Tests (Linux, mit virtuellem Display)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        env:
          PDF_ANONYMISIERER_SCREENSHOTS: ${{ runner.temp }}/screenshots
          PDF_ANONYMISIERER_BERICHT: ${{ runner.temp }}/bericht
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -W ignore -m pytest -q -rs --timeout=300 --timeout-method=thread --durations=15 tests/

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 25
        env:
          PDF_ANONYMISIERER_SCREENSHOTS: ${{ runner.temp }}/screenshots
          PDF_ANONYMISIERER_BERICHT: ${{ runner.temp }}/bericht
        run: python -W ignore -m pytest -v -rs --timeout=300 --timeout-method=thread --durations=15 tests/

      - name: Layout-Screenshots sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: layout-screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Benchmark-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-bericht-${{ matrix.os }}
          path: ${{ runner.temp }}/bericht/
          if-no-files-found: ignore
          retention-days: 14

  # Baut die Windows-EXE genau so wie der Makler: mit EXE-bauen.bat (gleiche PyInstaller-Flags,
  # Lizenzdateien, ZIP). Fuer jeden Pull Request (eine EXE, die nicht baut oder nicht startet, faellt so
  # vor dem Release auf), von Hand (Actions -> Tests -> "Run workflow") und fuer Versions-Tags v*.
  exe:
    name: EXE bauen (windows-latest)
    needs: pytest
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Pakete installieren (wie Installieren.bat, dazu PyInstaller)
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      # Code-Signatur: nur wenn das Repository die Geheimnisse CODESIGN_PFX_BASE64 (Zertifikat als Base64) und
      # CODESIGN_PFX_KENNWORT hat. Das Zertifikat landet in einer temporären Datei, EXE-bauen.bat signiert damit vor
      # dem Packen der ZIP (SHA-256 mit Zeitstempel). Ohne Geheimnisse - auch bei Pull Requests aus Forks - bleibt
      # die EXE unsigniert wie bisher.
      - name: Signaturzertifikat bereitstellen (falls hinterlegt)
        shell: pwsh
        timeout-minutes: 2
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PFX_KENNWORT: ${{ secrets.CODESIGN_PFX_KENNWORT }}
        run: |
          if (-not $env:PFX_B64) { "Kein Signaturzertifikat hinterlegt - die EXE bleibt unsigniert."; exit 0 }
          $pfad = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfad, [Convert]::FromBase64String($env:PFX_B64))
          "PDFA_SIGNATUR_PFX=$pfad" >> $env:GITHUB_ENV
          "PDFA_SIGNATUR_KENNWORT=$env:PFX_KENNWORT" >> $env:GITHUB_ENV
          "Signaturzertifikat bereitgestellt."

      # .python_pfad.txt zeigt - wie nach Installieren.bat - auf das Python dieses Laufs.
      # "< NUL" beantwortet das "pause" am Ende der Batchdatei.
      - name: EXE-bauen.bat
        shell: cmd
        timeout-minutes: 30
        run: |
          python -c "import sys; open('.python_pfad.txt', 'w', encoding='utf-8').write(sys.executable)"
          call EXE-bauen.bat < NUL
          if errorlevel 1 exit /b 1

      # Die Visual-C++-Laufzeit gehoert in den Ordner: Die EXE soll auch ohne installierte
      # "Visual C++ Redistributable" starten (die Skript-Version braucht sie, die EXE nicht).
      - name: Bundle und ZIP pruefen (OCR-Sprachdatei, Sprachmodell, VC-Laufzeit, Lizenztexte)
        id: pruefung
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ordner = "dist\PDF-Anonymisierer"
          $pflicht = "PDF-Anonymisierer.exe", "_internal\tessdata\deu.traineddata", "LICENSE.txt",
                     "THIRD_PARTY_NOTICES.md", "README.md", "licenses\AGPL-3.0.txt",
                     "_internal\msvcp140.dll", "_internal\vcruntime140_1.dll"
          foreach ($datei in $pflicht) {
            if (-not (Test-Path (Join-Path $ordner $datei))) { throw "Fehlt im Programmordner: $datei" }
          }
          $modell = Get-ChildItem "$ordner\_internal\de_core_news_md" -Recurse -Filter config.cfg -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $modell) { throw "Sprachmodell de_core_news_md fehlt im Programmordner" }
          "Sprachmodell: $($modell.DirectoryName)"
          if (-not (Select-String -Path "$ordner\licenses\AGPL-3.0.txt" -SimpleMatch "GNU AFFERO GENERAL PUBLIC LICENSE" -Quiet)) {
            throw "licenses\AGPL-3.0.txt enthaelt nicht den AGPL-Text"
          }
          $zip = Get-ChildItem dist -Filter "PDF-Anonymisierer-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "ZIP fehlt in dist" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archiv = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try { $eintraege = $archiv.Entries | ForEach-Object { $_.FullName -replace '\\', '/' } } finally { $archiv.Dispose() }
          foreach ($datei in $pflicht) {
            $name = "PDF-Anonymisierer/" + ($datei -replace '\\', '/')
            if ($eintraege -notcontains $name) { throw "Fehlt in der ZIP: $name" }
          }
          "{0}: {1:N0} MB, {2} Eintraege; Ordner {3:N0} MB" -f $zip.Name, ($zip.Length / 1MB), $eintraege.Count,
            ((Get-ChildItem $ordner -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          $signatur = Get-AuthenticodeSignature "$ordner\PDF-Anonymisierer.exe"
          "Code-Signatur: $($signatur.Status) $($signatur.SignerCertificate.Subject)"
          if ($env:PDFA_SIGNATUR_PFX -and $signatur.Status -ne "Valid") { throw "EXE sollte signiert sein, ist es aber nicht" }
          "zipname=$($zip.BaseName)" >> $env:GITHUB_OUTPUT

      - name: Rauchtest - EXE startet, zeigt ihr Fenster und schreibt keine fehler.log
        shell: pwsh
        timeout-minutes: 5
        run: |
          $logs = (Join-Path $env:LOCALAPPDATA "PDF-Anonymisierer\fehler.log"), "dist\PDF-Anonymisierer\fehler.log"
          $logs | ForEach-Object { Remove-Item $_ -ErrorAction SilentlyContinue }
          $exe = (Resolve-Path "dist\PDF-Anonymisierer\PDF-Anonymisierer.exe").Path
          $p = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $titel = ""
          for ($i = 0; $i -lt 60 -and -not $p.HasExited; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.MainWindowTitle) { $titel = $p.MainWindowTitle; break }
          }
          Start-Sleep -Seconds 5
          $laeuft = -not $p.HasExited
          if ($laeuft) { Stop-Process -Id $p.Id -Force }
          "Fenstertitel: '$titel'"
          foreach ($log in $logs) {
            if (Test-Path $log) { Get-Content $log; throw "Die EXE hat beim Start eine fehler.log geschrieben ($log)." }
          }
          if (-not $laeuft) { throw "Die EXE hat sich beim Start beendet (Exit-Code $($p.ExitCode))." }
          if ($titel -notlike "PDF-Anonymisierer*") {
            "::warning::Kein Fenster 'PDF-Anonymisierer ...' erkannt (Titel: '$titel') - Screenshot/Log pruefen."
          }

      - name: ZIP als Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pruefung.outputs.zipname }}
          path: dist/${{ steps.pruefung.outputs.zipname }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Volle Domänen-Probe (werkzeuge/domaenenprobe) nur von Hand: Actions -> Tests -> "Run workflow" mit Haken bei
  # "domaenenprobe". Misst alle Falldateien mit der Tesseract-Kommandozeile, vergleicht mit referenz.json und legt
  # bericht.md und ergebnis.json als Artefakt ab. Unabhängig von den anderen Jobs (kein needs), die unverändert laufen.
  domaenenprobe:
    name: Domänen-Probe (ubuntu-latest)
    if: github.event_name == 'workflow_dispatch' && inputs.domaenenprobe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Die deutsche Sprachdatei kommt aus tessdata/ des Repositorys (das Programm setzt TESSDATA_PREFIX).
      - name: Tesseract-Kommandozeile und DejaVu-Schriften
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr fonts-dejavu-core

      # Pillow für die Scan-Varianten der Falldateien (Drehung, JPEG); das Programm selbst braucht es nicht.
      - name: Pakete installieren (nur fertige Wheels, kein Quellbau)
        timeout-minutes: 15
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt pillow

      - name: Domänen-Probe messen und mit der Referenz vergleichen
        timeout-minutes: 75
        run: python -W ignore werkzeuge/domaenenprobe/messen.py "${{ runner.temp }}/domaene" --jobs 2

      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: domaenenprobe-bericht
          path: |
            ${{ runner.temp }}/domaene/bericht.md
            ${{ runner.temp }}/domaene/ergebnis.json
          if-no-files-found: ignore
          retention-days: 30
