name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      # Mitgelieferte deutsche OCR-Sprachdatei aus dem Repository
      TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Systempakete fuer Linux (virtuelles Display und Tk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb tk

      - name: Pakete installieren (nur fertige Wheels, kein Quellbau)
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt

      - name: Installation pruefen
        run: python werkzeuge/pruefe_installation.py

      - name: Tests (Linux, mit virtuellem Display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -W ignore -m pytest -q tests/

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -W ignore -m pytest -q tests/
